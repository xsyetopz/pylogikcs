[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pylogikcs"
version = "0.1.0"
description = "Read, edit, and write Logic Pro .logikcs key-command preset files"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pylogikcs contributors" }]
keywords = ["logic-pro", "key-commands", "logikcs", "midi", "daw"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
pylogikcs = "pylogikcs._cli:main"

[project.urls]
Repository = "https://github.com/user/pylogikcs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle errors / warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["pylogikcs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
